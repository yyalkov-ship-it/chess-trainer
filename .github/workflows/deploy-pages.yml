name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install official Stockfish 18
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/stockfish-ubuntu-x86-64-avx2.tar"
          install_dir="$RUNNER_TEMP/stockfish-18"
          curl --fail --location --retry 3 \
            --output "$archive" \
            https://github.com/official-stockfish/Stockfish/releases/download/sf_18/stockfish-ubuntu-x86-64-avx2.tar
          echo "536c0c2c0cf06450df0bfb5e876ef0d3119950703a8f143627f990c7b5417964  $archive" | sha256sum --check --status || {
            echo "::error::Контрольная сумма официального Stockfish 18 не совпала"
            exit 1
          }
          mkdir -p "$install_dir"
          tar -xf "$archive" -C "$install_dir"
          stockfish_path="$(find "$install_dir" -type f -name 'stockfish-ubuntu-x86-64-avx2' -print -quit)"
          if [[ -z "$stockfish_path" || ! -f "$stockfish_path" ]]; then
            echo "::error::Официальный бинарник Stockfish 18 не найден в архиве"
            exit 1
          fi
          chmod +x "$stockfish_path"
          echo "STOCKFISH_PATH=$stockfish_path" >> "$GITHUB_ENV"
      - run: npm run validate:content
      - run: npm run verify:engine
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
